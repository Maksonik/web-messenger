[project]
name = "messenger-backend"
version = "0.1.0"
description = "Real-time web messenger backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat it as first-party.
known-third-party = ["alembic"]
